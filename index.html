<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Heart Disease Prediction</h1>
    <p class="subtitle">
        Enter patient information to estimate heart disease risk.
    </p>

    <form id="predictionForm">

        <div class="form-grid">

            <div>
                <label>Age</label>
                <input type="number" id="age" required>
            </div>

            <div>
                <label>Sex</label>
                <select id="sex">
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div>
                <label>Chest Pain Type</label>
                <input type="number" id="cp" min="0" max="3" required>
            </div>

            <div>
                <label>Resting Blood Pressure</label>
                <input type="number" id="trestbps" required>
            </div>

            <div>
                <label>Cholesterol</label>
                <input type="number" id="chol" required>
            </div>

            <div>
                <label>Fasting Blood Sugar</label>
                <select id="fbs">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div>
                <label>Resting ECG</label>
                <input type="number" id="restecg" min="0" max="2" required>
            </div>

            <div>
                <label>Maximum Heart Rate</label>
                <input type="number" id="thalach" required>
            </div>

            <div>
                <label>Exercise Induced Angina</label>
                <select id="exang">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div>
                <label>Oldpeak</label>
                <input type="number" step="0.1" id="oldpeak" required>
            </div>

            <div>
                <label>Slope</label>
                <input type="number" id="slope" min="0" max="2" required>
            </div>

            <div>
                <label>Major Vessels</label>
                <input type="number" id="ca" min="0" max="4" required>
            </div>

            <div>
                <label>Thal</label>
                <input type="number" id="thal" required>
            </div>

        </div>

        <button type="submit">
            Predict
        </button>

    </form>

    <div id="result"></div>

    <p class="disclaimer">
        This tool is for educational purposes only and is not a medical diagnosis.
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
